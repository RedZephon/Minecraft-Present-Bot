services:
  mc-presence:
    build: .
    container_name: mc-presence-bot
    restart: unless-stopped
    # Host network so the bot can reach the CobbleBridge plugin on localhost
    network_mode: "host"
    volumes:
      - mc-auth:/app/.minecraft
      - mc-data:/app/data
    environment:
      MC_HOST: "your.server.com"
      MC_PORT: "25565"
      WEB_PORT: "3100"
      # Strongly recommended: anyone who can reach the dashboard can chat and
      # run commands as your accounts.
      DASHBOARD_PASSWORD: ""
      OWNER_USERNAME: ""   # Your MC username — the only account allowed the AFK Responder
      STAFF_USERNAMES: ""  # Other staff, comma-separated
      SERVER_TIMEZONE: ""  # e.g. America/Edmonton
      # CobbleBridge plugin connection (optional). Use a long random secret
      # and set the same value in the plugin.
      BRIDGE_URL: "http://localhost:3101"
      BRIDGE_SECRET: ""
    # The image ships a HEALTHCHECK against /healthz.

volumes:
  mc-auth:
    driver: local
  mc-data:
    driver: local
